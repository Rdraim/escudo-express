name: Refresh visible badges
on:
  schedule:
    - cron: '23 */6 * * *'
  workflow_dispatch:
  workflow_run:
    workflows: ['Public code checks']
    types: [completed]
    branches: [main]
  release:
    types: [published]
  watch:
    types: [started]
  fork:
permissions:
  contents: read
concurrency:
  group: refresh-visible-badges
  cancel-in-progress: false
jobs:
  refresh:
    if: github.repository_owner == 'Rdraim' && (github.event_name != 'workflow_run' || github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'
      - run: node tools/update-badges.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - run: node --test tools/update-badges.test.mjs
      - run: node tools/check-public-content.mjs --history
      - name: Publish only badge assets and translated README blocks
        shell: bash
        run: |
          git add README.md README.en-US.md README.es-AR.md assets/support/badge-*.svg
          if git diff --cached --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Refresh valid README badges'
          git push origin HEAD:main
